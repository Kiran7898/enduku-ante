<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤣😭</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;background:#050505;color:#fff;font-family:Arial,sans-serif;
  overflow:hidden;
}
.message{
  max-width:92%;text-align:center;font-size:27px;font-weight:700;
  line-height:1.5;opacity:0;transform:scale(.75);
  animation:show 2s ease forwards;
  text-shadow:0 0 18px rgba(255,255,255,.18);
}
@keyframes show{
  0%{opacity:0;transform:scale(.75)}
  60%{opacity:1;transform:scale(1.05)}
  100%{opacity:1;transform:scale(1)}
}
.emoji{display:inline-block;animation:shake 1.8s ease-in-out infinite}
@keyframes shake{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-8deg)}
  75%{transform:rotate(8deg)}
}
</style>
</head>
<body>
<div class="message">
  Enduku ante nuv kuda chusi dipression lo ki povalii
  <span class="emoji">🤣🤣😢😭😭🤧</span>
</div>
</body>
</html>
